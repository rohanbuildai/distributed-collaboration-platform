
name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: distributed_collaboration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d distributed_collaboration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: distributed_collaboration_test
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ci_test_password
      JWT_ACCESS_SECRET: ci_only_secret_key_for_automated_testing_123456
      JWT_ACCESS_EXPIRES_IN: 15m
      CLIENT_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        env:
          PGPASSWORD: ci_test_password
        run: |
          for migration in database/migrations/*.sql; do
            echo "Applying migration: $migration"

            psql \
              -h 127.0.0.1 \
              -p 5432 \
              -U postgres \
              -d distributed_collaboration_test \
              -v ON_ERROR_STOP=1 \
              -f "$migration"
          done

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build production application
        working-directory: frontend
        run: npm run build
